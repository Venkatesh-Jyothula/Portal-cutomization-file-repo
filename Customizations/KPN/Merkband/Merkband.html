<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

    <title>Reserve Merkband Names</title>    
	<style>
        * {
            box-sizing: border-box;
        }
		body {
            margin: 0;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 90%;
            max-width: 500px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        label {
            font-weight: bold;
        }
        input, button, select {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            box-sizing: border-box;
        }
        .button-group {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

	<script src="Merkband.js"></script>

        <!-- <h2>Reserve Merkband Names</h2> -->
        
        <label for="numMerkbandNames">Number of Merkband Names</label>
        <input type="number" id="numMerkbandNames" placeholder="Enter number">
        <button id="btnReserve" onclick="reserveNames()">Reserve</button>

        <label for="reservedList">Reserved Merkband Names</label>
        <select id="reservedList" multiple size="6">
            <!-- Dynamically populated options -->
        </select>

        <div class="button-group">
            <button id="btnAgree" onclick="agreeAction()">Agree</button>
            <button id="btnDisagree" onclick="disagreeAction()">Disagree</button>
        </div>       
    </div>
