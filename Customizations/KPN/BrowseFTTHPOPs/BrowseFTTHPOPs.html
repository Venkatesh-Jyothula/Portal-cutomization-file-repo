<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --line: #e2e8f0;
      --hover: #f6f9ff;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
    }
    body { font-family: sans-serif; font-size:13px; margin-top: 20px; color: var(--text); }

    .tree, .tree ul { list-style: none; margin: 0; padding-left: 1rem; }
    .tree ul { border-left: 1px dashed var(--line); margin-left: 2px; }

    .node { margin: 3px 0; }
    .row {
      display: flex; align-items: center; gap: 8px;
      
    }
    .row:hover { background: lavender; }

    /* +/- button */
    .toggle {
      width: 15px; height: 15px; line-height: 20px;
      display: inline-flex; align-items: center; justify-content: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      border: 1px solid var(--border); border-radius: 4px;
      background: #fff; cursor: pointer;
      color: #111;
    }
    .toggle[aria-hidden="true"] { visibility: hidden; } /* hide on leaves */
    .toggle[disabled] { opacity: 0.6; cursor: wait; }

    .label { cursor: default; flex: 1 1 auto; white-space: nowrap;}

    /* Spinner (shown during lazy load) */
    .spinner {
      width: 16px; height: 16px; border: 2px solid #ddd;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-left: 2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Icons */
    .icon {
      width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center;
    }
    .icon img { width: 16px; height: 16px; display: block; }

    /* Selected leaf (optional) */
    .selected { background: #eaf2ff; }

    /* Tooltip */
    .tooltip {
      position: fixed;
      z-index: 9999;
      max-width: 320px;
      padding: 8px 10px;
      background: gray;
      color: white;
      border-radius: 6px;
      font-size: 12.5px;
      line-height: 1.35;
      box-shadow: 0 8px 16px rgba(0,0,0,.18);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .12s ease, transform .12s ease;
      white-space:nowrap;
    }
    .tooltip[data-show="true"] {
      opacity: 1;
      transform: translateY(0);
    }
    .tooltip .muted { color: #cbd5e1; }

    /* Context menu */
    .ctx-menu {
      position: fixed;
      z-index: 9999;
      min-width: 200px;
      background: #2563eb;
      border: 1px solid var(--border);
      border-radius: 1px;
      padding: 2px 2px;
      display: none;
      color:white;
    }
    .ctx-item {
      display: flex; align-items: center; gap: 8px;
      padding: 2px 2px; border-radius: 6px; cursor: pointer;
      white-space: nowrap; user-select: none;
    }
      
    .hint { color: var(--muted); font-size: 12px; margin: 6px 0 12px; }

    #popsearch{
      width:250px;
      margin-left: 17px;
    }

    .search{
      margin-bottom: 5px;
    }

    .btn{
      width:55px;
    }
  </style>
</head>
<body>
  <script src="BrowseFTTHPOPs.js"></script>
  <div id="search" class="search">
    <input type="text" id="popsearch" name="popsearch" placeholder="Enter POP name to search ..." autocomplete="off">
    <button id="searchBtn" class="btn" type="button" onclick=searchPOP()>Search</button>
    <button id="clearBtn" class="btn" type="button" onclick=clearSearch()>Clear</button>
  </div>
  

  <div id="treeHost"></div>

  <!-- Shared tooltip element -->
  <div id="treeTooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>

  <!-- Context menu root -->
  <div id="ctxMenu" class="ctx-menu" role="menu" aria-hidden="true"></div>
  <script>
     // Mount
     const host = document.getElementById('treeHost');
     createPlusMinusLazyTree(host, data, {
         startExpanded: (node) => node.id === 'docs', // example: open only "Documents" initially
         onLeafClick: (node) => {
             if (node.meta?.href) {
                window.open(node.meta.href, '_blank');
             } else {
             console.log('Leaf clicked:', node.label);
             }
         },
    });

    
    const tipEl = document.getElementById('treeTooltip');

    const searchInput = document.getElementById('popsearch');
    searchInput.addEventListener('keyup', function(event) {
	if (event.key == "Enter"){
	     searchPOP();
	}  	

	if (this.value.trim().length === 0) {
    	     clearSearch();
             searchInput.innerHTML = '';
    } 
});
    
  </script>
 </body>
</html>
