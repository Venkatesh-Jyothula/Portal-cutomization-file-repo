<html>
<head>
<title>What3Words Search</title>

<script>

const w3wKey="WBDOR7RV";

function initW3W(){
    const me = this;
}

function searchFromWGS84() {
    const me = this;
    var lonCC = document.getElementById("lonCC");
	var latCC = document.getElementById("latCC");
	var language= document.getElementById("language");
    fetch("https://api.what3words.com/v3/convert-to-3wa?coordinates="+latCC.value+","+lonCC.value+"&language="+language.value+"&key="+w3wKey).then(
        (response) => {
            return response.json();
        }
    ).then((json) => {me.onResultLoad(json,'wgs84',false)});
}

function searchFromXY() {
    const me = this;
    var xCC = document.getElementById("xCC");
	var yCC = document.getElementById("yCC");
	var language= document.getElementById("language");
	var point=ol.proj.transform([xCC.value,yCC.value],$NWP.request('mapviewstate')[0].projection,'EPSG:4326');
//console.log(point);
    fetch("https://api.what3words.com/v3/convert-to-3wa?coordinates="+point[1]+","+point[0]+"&language="+language.value+"&key="+w3wKey).then(
        (response) => {
            return response.json();
        }
    ).then((json) => {me.onResultLoad(json,'current',false)});
}

function searchFromW3W() {
    const me = this;
    var w3w = document.getElementById("w3w");
    fetch("https://api.what3words.com/v3/convert-to-coordinates?words="+w3w.value+"&key="+w3wKey).then(
        (response) => {
            return response.json();
        }
    ).then((json) => {me.onResultLoad(json,'w3w',false)});
}
	 
function onResultLoad(w3wFeature,source,locate) {
//console.log(w3wFeature);
	if(w3wFeature==null){
		return;
	}
	var xCC = document.getElementById("xCC");
	var yCC = document.getElementById("yCC");
	var lonCC = document.getElementById("lonCC");
	var latCC = document.getElementById("latCC");
	var w3w = document.getElementById("w3w");
	var address = document.getElementById("address");
	
	address.value=w3wFeature.nearestPlace;
	w3w.value=w3wFeature.words;
	if(source=='wgs84')
	{
		var point=ol.proj.transform([lonCC.value,latCC.value],'EPSG:4326',$NWP.request('mapviewstate')[0].projection);
		xCC.value=point[0];
		yCC.value=point[1];
		if(locate==true){
			locateFromWGS84();
		}
	}
	else if (source=='current')
	{
		var point=ol.proj.transform([xCC.value,yCC.value],$NWP.request('mapviewstate')[0].projection,'EPSG:4326');
		lonCC.value=point[0];
		latCC.value=point[1];
		if(locate==true){
			locateFromWY();
		}
	}
	else if(source=='w3w')
	{
//console.log("w3w");
//console.log(w3wFeature.coordinates);
//console.log(w3wFeature.coordinates.lat);
		lonCC.value=w3wFeature.coordinates.lng;
		latCC.value=w3wFeature.coordinates.lat;
		var point=ol.proj.transform([lonCC.value,latCC.value],'EPSG:4326',$NWP.request('mapviewstate')[0].projection);
		xCC.value=point[0];
		yCC.value=point[1];
		if(locate==true){
			locateFromWGS84();
		}
	}
}

function locateFromWGS84() {

	var lonCC = document.getElementById("lonCC");
	var latCC = document.getElementById("latCC");
	
    //Getting the current coordinate system	
	var viewProj = $NWP.request('mapviewstate')[0].projection;
//Converting from WGS84 to the current coordinate system
	var point=ol.proj.transform([lonCC.value, latCC.value],'EPSG:4326',viewProj);

	//var point=ol.proj.fromLonLat([coordLon.value, coordLat.value], viewProj);
	var geojsonObject = {
		'type': 'FeatureCollection',
		'crs': {
			'type': 'name',
			'properties': {
				'name': viewProj
			}
		},
		'features': [{
			'type': 'Feature',
			'geometry': {
				'type': 'Point',
				'coordinates': [point[0], point[1]]
			}
		}]
	};

	var feature = geojsonObject.features[0];
//Fir on the point
	$NWP.request('featurehighlight', {features: [feature], fit:true});
}

function locateFromXY() {
	var xCC = document.getElementById("xCC");
	var yCC = document.getElementById("yCC");
	var viewProj = $NWP.request('mapviewstate')[0].projection;
	
	var geojsonObject = {
		'type': 'FeatureCollection',
		'crs': {
			'type': 'name',
			'properties': {
				'name': viewProj
			}
		},
		'features': [{
			'type': 'Feature',
			'geometry': {
				'type': 'Point',
				'coordinates': [xCC.value, yCC.value]
			}
		}]
	};

	var feature = geojsonObject.features[0];
//Fir on the point
	$NWP.request('featurehighlight', {features: [feature], fit:true});
}

function locateFromW3W() {
	var w3w = document.getElementById("w3w");
	const me = this;
    fetch("https://api.what3words.com/v3/convert-to-coordinates?words="+w3w.value+"&key="+w3wKey).then(
        (response) => {
            return response.json();
        }
    ).then((json) => {me.onResultLoad(json,'w3w',true)});
}

function focusin(args)
{
	parent.$NWP.map.setModeToDefault();
	
}

function focusout(args)
{
	parent.$NWP.map.resetMode();
	parent.$NWP.on("sidebarpanelupdating", null, "");
}


//Create and add the new interaction
function selectPoint()
{
	$NWP.map.drawGeometry($NWP.map.geometryType.POINT).then(function(result) {
			var xCC = document.getElementById("xCC");
			var yCC = document.getElementById("yCC");
			var coordinates=result.coordinates;
			xCC.value=Math.round(coordinates[0]*100)/100;
			yCC.value=Math.round(coordinates[1]*100)/100;			
			searchFromXY();	
	})	
}
		

function main() {
	//Retrieving the openlayer and Networks Portal references
	window.ol = parent.ol;
	window.proj4 = parent.proj4;
	window.$NWP = parent.$NWP;
	window.map=$NWP.map.getOlMapObject();
	
	
	initW3W();
}
</script>
