//Message to show when the user is drawing a polygon.  @type {string}
	var continuePolygonMsg = 'Click to continue drawing the polygon';
//Message to show when the user is drawing a line. @type {string}

//Message to get point coordinate

 //Handle pointer move. @param {import("../src/ol/MapBrowserEvent").default} evt The event.

	var formatLength;

	function computeCurrLength(geom)
	{
		var coordinates=geom.getCoordinates();
		var n=coordinates.length;
		if(n>2)
			n--;
		var newC=[];
		for(i=0;i<n;i++){
			newC[i]=coordinates[i];
		}
		var newLine=new ol.geom.LineString(newC);
		var length = ol.Sphere.getLength(newLine);
		curLength.value=Math.round(length*100)/100;
		newLine=null;
		newC=null;
	}
	
	function defineVectorLayers()
	{
		source=null;
		source = new ol.source.Vector(); //VectorSource();

		vector = new ol.layer.Vector({
			source: source,
			style: new ol.style.Style({
				fill: new ol.style.Fill({
				color: 'rgba(100, 100, 100, 0.2)'
				}),
				stroke: new ol.style.Stroke({
					color: '#ffcc33',
					width: 2
				}),
				image: new ol.style.Circle({
					radius: 7,
					fill: new ol.style.Fill({
						color: '#ffcc33'
					})
				})
			})
		});
		map.addLayer(vector);
	}
	
//Initailization of the main events
	function InitMeasurement()
	{
		helpTooltipElement=null;
		helpMsg='';
		const me = this;
				
		defineVectorLayers();

		pointerMoveHandler = function(evt) {
			if (evt.dragging) {
				return;
			}
			
			if(currentMeasure!='XY'){
				helpMsg = 'Click to start drawing'; //attached to the mouse
			}
			else{
				helpMsg=getXYMsg;
			}

			if (sketch) {
				var geom = sketch.getGeometry();
				coordX.value=Math.round(evt.coordinate[0]*100)/100;
				coordY.value=Math.round(evt.coordinate[1]*100)/100;
				var point=ol.proj.transform(evt.coordinate,$NWP.request('mapviewstate')[0].projection,'EPSG:4326');
//console.log(evt.coordinate);
//console.log(point);
				coordLon.value=Math.round(point[0]*100000000)/100000000;
				coordLat.value=Math.round(point[1]*100000000)/100000000;
				
				if (geom instanceof ol.geom.Polygon) {
					helpMsg = continuePolygonMsg;
				} else if (geom instanceof ol.geom.LineString) {
					helpMsg = continueLineMsg;
					computeCurrLength(geom);
					//console.log(geom);
				}		
			}

			if(helpTooltipElement){
				helpTooltipElement.innerHTML = helpMsg;
				helpTooltip.setPosition(evt.coordinate);
//				helpTooltipElement.classList.remove('hidden');
			}
		};

		formatLength = function(line) {
			var length = ol.Sphere.getLength(line);
			var output;
			if (length > 500) {
				output = (Math.round(length / 1000 * 100) / 100) +
					' ' + 'km';
			} else {
				output = (Math.round(length * 100) / 100) +
					' ' + 'm';
			}
			return output;
		};
			
		formatArea = function(polygon) {
			var area = ol.Sphere.getArea(polygon);
			var output;
			if (area > 50000) {
				output = (Math.round(area / 1000000 * 100) / 100) +
					' ' + 'km<sup>2</sup>';
			} else {
				output = (Math.round(area * 100) / 100) +
					' ' + 'm<sup>2</sup>';
			}
				return output;
		};
			
		map.on('pointermove', pointerMoveHandler);

		curLength = document.getElementById('curLength');
		coordX = document.getElementById('coordX');
		coordY = document.getElementById('coordY');
		coordLon = document.getElementById('coordLon');
		coordLat = document.getElementById('coordLat');
		checkSV = document.getElementById('checkSV');
		winSV=null;
		pushState=null;
	}
		
	function createHelpTooltipStyle(element)
	{
		element.style.position='relative';
		element.style.background='darkblue';
		element.style.borderRadius='4px';
		element.style.color='white';
		element.style.padding='4px 8px';
		element.style.opacity='0.7';
		element.style.whiteSpace='nowrap';
		element.style.fontSize='12px';
		element.style.fontWeight='bold';
	}
//Creates a new help tooltip
	function createHelpTooltip()
	{
		if (helpTooltipElement) {
			helpTooltipElement.parentNode.removeChild(helpTooltipElement);
		}
		helpTooltipElement = parent.document.createElement('div');
		createHelpTooltipStyle(helpTooltipElement);
		
		helpTooltip = new ol.Overlay({
			element: helpTooltipElement,
			offset: [15, 0],
			positioning: 'center-left'
		});
		map.addOverlay(helpTooltip);
	}

	function createTooltipStyle(element)
	{
		element.style.position='relative';
		element.style.background='darkblue';
		element.style.borderRadius='4px';
		element.style.color='white';
		element.style.padding='4px 8px';
		element.style.opacity='0.7';
		element.style.whiteSpace='nowrap';
		element.style.fontSize='12px';
		element.style.fontWeight='bold';
	}
//Creates a new measure tooltip
	function createMeasureTooltip()
	{
		if (measureTooltipElement) {
			measureTooltipElement.parentNode.removeChild(measureTooltipElement);
		}
		measureTooltipElement = document.createElement('div');
		createTooltipStyle(measureTooltipElement);
		
		
		measureTooltip = new ol.Overlay({
			element: measureTooltipElement,
			offset: [0, -15],
			positioning: 'bottom-center'
		});
		map.addOverlay(measureTooltip);
	}

	function openStreetView(x,y)
	{
	// http://www.google.com/maps?layer=c&cbll=31.335198,-89.287204
	//  http://www.google.com/maps?layer=c&cbll=31.335198,-89.287204&cbp=,30,,,20 with rotation 30 and pitch 20.
			
		var point=ol.proj.transform([x,y],$NWP.request('mapviewstate')[0].projection,'EPSG:4326');
		var url='http://www.google.com/maps?layer=c&cbll='+point[1]+','+point[0];
		openInNewTab(url);
	}

//Compute the middle point of a linestring - ATTENTION!!! not tested in geographic coordinates!!!
	function getMiddlePoint(linestring)
	{
		var length=ol.Sphere.getLength(linestring)/2; //the half of length of the linestring
		var points=linestring.getCoordinates(); //all the points of the linestring
		
		var cumul=0.0;
		var midPoint=[];
		midPoint[0]=points[points.length-1][0];//initialize to the last point
		midPoint[1]=points[points.length-1][1];
		
		for (i=1;i<points.length;i++)
		{
			var startPoint=points[i-1];
			var endPoint=points[i];
			var newC=[];
			newC[0]=startPoint;
			newC[1]=endPoint;
		
			var newLine=new ol.geom.LineString(newC);
			var dist = ol.Sphere.getLength(newLine); //To get the length in all coordinate systems
			//var dist=Math.sqrt((endPoint[0]-startPoint[0])*(endPoint[0]-startPoint[0])+(endPoint[1]-startPoint[1])*(endPoint[1]-startPoint[1])); //length of the vector
			if(cumul+dist>=length) //if the current vertice contains the mid point
			{
				var remaining=length-cumul;
				var ratio=remaining/dist;
				midPoint[0]=startPoint[0]+ratio*(endPoint[0]-startPoint[0]);
				midPoint[1]=startPoint[1]+ratio*(endPoint[1]-startPoint[1]);
				break;
			}
			cumul=cumul+dist;
		}
		return midPoint;
	}
	
//Event to stop display the text when exiting the window
	function handlerMouseOut()
	{
		helpTooltipElement.classList.add('hidden');
	}
	
//Create and add the new interaction
	function addInteraction()
	{
		var type;
		if(currentMeasure == 'Area'){
			type='Polygon';
		}
		else if(currentMeasure=='Line'){
			type='LineString';
		}
		else{
			type='Point';
		}
			
		draw = new ol.interaction.Draw({
			source: source,
			type: type,
			style: new ol.style.Style({
				fill: new ol.style.Fill({
					color: 'rgba(255, 255, 255, 0.2)'
				}),
				stroke: new ol.style.Stroke({
					color: 'rgba(0, 0, 0, 0.5)',
					lineDash: [10, 10],
					width: 2
				}),
				image: new ol.style.Circle({
					radius: 5,
					stroke: new ol.style.Stroke({
						color: 'rgba(0, 0, 0, 0.7)'
					}),
					fill: new ol.style.Fill({
						color: 'rgba(255, 255, 255, 0.2)'
					})
				})
			})
		});

		var interactions=map.getInteractions();
		interactions.insertAt(interactions.getArray().length,draw); //inserting the interaction on last position to be sure it tkaes the hughest piority (not working...)
		//map.addInteraction(draw);

		createMeasureTooltip();
		createHelpTooltip();
			
		helpTooltipElement.classList.remove('hidden');
		
		map.getViewport().addEventListener('mouseout', handlerMouseOut);

//Manage the drawstart event
		var listener;
		draw.on('drawstart',
			function(evt) {
				// set sketch
				sketch = evt.feature;
				//@type {import("../src/ol/coordinate.js").Coordinate|undefined}
				var tooltipCoord = evt.coordinate;
				listener = sketch.getGeometry().on('change', function(evt) {
					var geom = evt.target;
					var output;
						
					if (geom instanceof ol.geom.Polygon) {
						output = formatArea(geom);
						tooltipCoord = geom.getInteriorPoint().getCoordinates();
					} else if (geom instanceof ol.geom.LineString) {
						output = formatLength(geom);
						tooltipCoord = geom.getLastCoordinate();
					}
							
					measureTooltipElement.innerHTML = output;
					measureTooltip.setPosition(tooltipCoord);
				});
			}
		);

//manage the drawen event.  Remove all the tooltips and stop sketching
		draw.on('drawend',
			function(evt) {	
				//map.removeOverlay(measureTooltip);
				var geom=evt.feature.getGeometry();
				measureTooltipElement.className = 'tooltip tooltip-static';
				if(currentMeasure=='Line'){
					var tooltipCoord = getMiddlePoint(geom);
					measureTooltip.setPosition(tooltipCoord);
				}
				//measureTooltip.setOffset([0, -7]);
				// unset sketch
				sketch = null;
				// unset tooltip so that a new one can be created
				measureTooltipElement = null;
				createMeasureTooltip();
				curLength.value='';
				if(currentMeasure=='XY'){
					var coordinates=geom.getCoordinates();
					coordX.value=Math.round(coordinates[0]*100)/100;
					coordY.value=Math.round(coordinates[1]*100)/100;
					var point=ol.proj.transform(coordinates,$NWP.request('mapviewstate')[0].projection,'EPSG:4326');
					coordLon.value=Math.round(point[0]*100000000)/100000000;
					coordLat.value=Math.round(point[1]*100000000)/100000000;

//console.log(checkSV.checked);
					if(checkSV.checked==true){
						openStreetView(coordinates[0],coordinates[1]);
					}
				}
				
				ol.Observable.unByKey(listener);
				evt.stopPropagation(); //Don't work...
			}
		);
	}
		
	function measureLine()
	{
		var img = document.getElementById('area');
		img.src='MeasureAreaOff.png';
		var img = document.getElementById('XY');
		img.src='GetXYOff.png';
		currentMeasure='Line';
		var img = document.getElementById('line');
		img.src='MeasureLineOn.png';
		
		executeMeasure();
	}

	function measureArea()
	{
		var img = document.getElementById('line');
		img.src='MeasureLineOff.png';
		var img = document.getElementById('XY');
		img.src='GetXYOff.png';
		currentMeasure='Area';
		var img = document.getElementById('area');
		img.src='MeasureAreaOn.png';
		executeMeasure();
	}

	function getXY()
	{
		var img = document.getElementById('line');
		img.src='MeasureLineOff.png';
		var img = document.getElementById('XY');
		img.src='GetXYOn.png';
		currentMeasure='Area';
		var img = document.getElementById('area');
		img.src='MeasureAreaOff.png';
		currentMeasure='XY';
		coordX.value='';
		coordY.value='';
		coordLon.value='';
		coordLat.value='';
		executeMeasure();
	}
	
//Start measure.  Adds the interaction and start listing the pointermove event
	function executeMeasure()
	{		
		if(draw!=null){
			map.removeInteraction(draw);
			draw=null;
		}
		
		parent.$NWP.on("sidebarpanelupdated", focusin, "");
		parent.$NWP.on("sidebarpanelupdating", focusout, "");
		parent.$NWP.map.setModeToDefault();

		addInteraction();
		map.on('pointermove', pointerMoveHandler);
	}

	function cleanupMap()
	{
		var img = document.getElementById('line');
		img.src='MeasureLineOff.png';
		img = document.getElementById('area');
		img.src='MeasureAreaOff.png';
		img = document.getElementById('XY');
		img.src='GetXYOff.png';

		map.removeLayer(vector);
		vector=null;
		
		defineVectorLayers();		
		
		if(draw!=null){
			map.removeInteraction(draw);
			draw.on('drawstart',null);
			draw.on('drawend',null);
			draw=null;
		}

		var overlays=map.getOverlays();
		var entries=overlays.getArray();
		var n=entries.length;
		for(i=0;i<n;i++)
		{
			map.removeOverlay(entries[0]);
		}
		measureTooltip=null;
		measureTooltipElement=null;
		helpTooltip=null;
		helpTooltipElement=null;
		
	}

//Stop measure - remove all tooltips, overlays, interaction, listener.  Reset the other interactions to active
	function stopMeasure()
	{
		cleanupMap();
		
		currentMeasure='';
		var interactions=map.getInteractions();
		var entries=interactions.getArray();
/*		
		for(i=0;i<entries.length;i++)
		{
			var interaction=entries[i];
			interaction.setActive(true);
		}
*/
		map.un('pointermove', pointerMoveHandler);
		map.getViewport().removeEventListener('mouseout', handlerMouseOut,);
	}
	
	function centerXY()
	{
		var viewProj = $NWP.request('mapviewstate')[0].projection;
		var geojsonObject = {
			'type': 'FeatureCollection',
			'crs': {
				'type': 'name',
				'properties': {
					'name': viewProj
				}
			},
			'features': [{
				'type': 'Feature',
				'geometry': {
					'type': 'Point',
					'coordinates': [coordX.value, coordY.value]
				}
			}]
		};

		var feature = geojsonObject.features[0];
//Fir on the point
		$NWP.request('featurehighlight', {features: [feature], fit:true});
	}

	function centerLonLat()
	{
	//Getting the current coordinate system	
		var viewProj = $NWP.request('mapviewstate')[0].projection;
//Converting from WGS84 to the current coordinate system
		var point=ol.proj.transform([coordLon.value, coordLat.value],'EPSG:4326',viewProj);

		//var point=ol.proj.fromLonLat([coordLon.value, coordLat.value], viewProj);
		var geojsonObject = {
			'type': 'FeatureCollection',
			'crs': {
				'type': 'name',
				'properties': {
					'name': viewProj
				}
			},
			'features': [{
				'type': 'Feature',
				'geometry': {
					'type': 'Point',
					'coordinates': [point[0], point[1]]
				}
			}]
		};

		var feature = geojsonObject.features[0];
//Fir on the point
		$NWP.request('featurehighlight', {features: [feature], fit:true});
	}
	
	function convertToXY()
	{
		var viewProj = $NWP.request('mapviewstate')[0].projection;
//Converting from WGS84 to the current coordinate system
		var point=ol.proj.transform([coordLon.value, coordLat.value],'EPSG:4326',viewProj);
		coordX.value=Math.round(point[0]*100)/100;
		coordY.value=Math.round(point[1]*100)/100;
	}
	
	function convertToLonLat()
	{
		var viewProj = $NWP.request('mapviewstate')[0].projection;
//Converting from the current coordinate system to WGS84
		var point=ol.proj.transform([coordX.value, coordY.value],viewProj,'EPSG:4326');
		coordLon.value=Math.round(point[0]*100000000)/100000000;
		coordLat.value=Math.round(point[1]*100000000)/100000000;
	}
	
	function focusin(args)
	{
		parent.$NWP.map.setModeToDefault();
		
	}
	
	function focusout(args)
	{
		//window.alert("ici");
		parent.$NWP.map.resetMode();
		
		if(draw!=null){
			map.removeInteraction(draw);
			draw.on('drawstart',null);
			draw.on('drawend',null);
			draw=null;
		}

		
		var overlays=map.getOverlays();
		var entries=overlays.getArray();
		var n=entries.length;
		for(i=0;i<n;i++)
		{
			map.removeOverlay(entries[0]);
		}
		parent.$NWP.on("sidebarpanelupdating", null, "");

	}


//Fired at the OnLoad event
	function main() {
		//Retrieving the openlayer and Networks Portal references
		window.ol = parent.ol;
		window.proj4 = parent.proj4;
		window.$NWP = parent.$NWP;
		window.myParent=parent;
		map=parent.Ext.ComponentQuery.query('hxgn-map')[0].getOlObject();
		window.map=map;
		
		currentMeasure='';
		var interactions=map.getInteractions();
		var entries=interactions.getArray();

		//console.log(map.getKeys());
		//map.removeEventListener('click');
		//map.on('click',null);
		
		//$NWP.request('mapsetmodetodefault');
		
		parent.$NWP.on("sidebarpanelupdated", focusin, "");
		parent.$NWP.on("sidebarpanelupdating", focusout, "");
		parent.$NWP.map.setModeToDefault();

		InitMeasurement();
	}
	</script>
