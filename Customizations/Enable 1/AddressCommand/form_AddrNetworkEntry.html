	function sendPostRequest(url,payload) {
    // Convert payload to JSON string
    var payloadString = JSON.stringify(payload);

    // Create new XMLHttpRequest object
    var xhr = new XMLHttpRequest();

    // Set the HTTP method, URL, and asynchronous flag
    xhr.open('POST', url, true);

    // Set the request header
    xhr.setRequestHeader('Content-Type', 'application/json');

    // Define the function to handle the response
    xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
            // Request was successful
            console.log('Request successful');
            console.log(xhr.responseText);
        } else {
            // Request failed
            console.error('Request failed');
            console.error(xhr.statusText);
        }
    };

    // Define the function to handle network errors
    xhr.onerror = function () {
        console.error('Network error');
    };

    // Send the request with the payload
    xhr.send(payloadString);
	IsDelete = "Yes";
}

		async function fetchNetworkSolutionData() {
		try {
			// Get the mapsource section
			var mapsource = parent.$NWP.workspace.getSection("mapsource");

			// Initialize variables
			var vectorServiceURL;

			// Loop through mapsource items to find the NetworksVector type
			for (var i = 0, iLen = mapsource.items.length; i < iLen; i++) {
				if (mapsource.items[i].type === 'NetworksVector') {
					vectorServiceURL = mapsource.items[i].url;
					urlSolution = vectorServiceURL.substring(0, vectorServiceURL.lastIndexOf('/')) + '/NetWorksSolutionService';
					break;
				}
			}

			// Check if urlSolution was found
			if (!urlSolution) {
				throw new Error("NetworksVector type not found in mapsource items.");
			}
			
			//Retrieve the DB Alias for the Solution Service
			var dbAlias=await parent.$NWP.fetchJson({ url: urlSolution });

			// Fetch data from the selected option endpoint
			const response = await fetch(`${urlSolution}/${dbAlias}/`, {
				method: 'GET',
				headers: {
					'Content-Type': 'application/json'
				}
			});

			// Check if the response is ok
			if (!response.ok) {
				throw new Error(`HTTP error! status: ${response.status}`);
			}

			// Parse the response data as JSON
			const urlSolutiondata = await response.json();

			// Check if urlSolutiondata is null
			if (urlSolutiondata === null) {
				throw new Error("Received null data from the network solution service.");
			}

			// Return the parsed data
			return urlSolutiondata;

		} catch (error) {
			// Handle errors
			console.error('Error fetching network solution data:', error);
			throw error;  // Re-throw the error after logging it
		}
	}
		function findServiceUrl(urlSolutiondata, serviceType) {
			for (const service of urlSolutiondata) {
				if (service.Type === serviceType) {
					return service.Url;
				}
			}
			throw new Error(`${serviceType} not found in network solution data.`);
		}

		async function getServiceUrl(serviceType) {
			try {
				// Fetch network solution data
				const urlSolutiondata = await fetchNetworkSolutionData();

				// Find and return the service URL for the specified service type
				const serviceUrl = findServiceUrl(urlSolutiondata, serviceType);
				return serviceUrl;
			} catch (error) {
				console.error('Error:', error);
				throw error;
			}
		}

	var urlNetWorkSolutiondata = null;
	async function fetchData() {
    try {
        AnalyticalUrl = await getServiceUrl('AnalyticalService');
        console.log('Service URL:', AnalyticalUrl);

        if (AnalyticalUrl != null) {
            const response = await fetch(AnalyticalUrl + '/Search/QuickSearches');
            const data = await response.json();

            // Loop through each object in the response array
            let g3e_amno = null;
            for (let item of data) {
                // Check if the UserName matches the targetUserName
                if (item.UserName === "Address to Network Entry") {
                    // Store the G3E_AMNO in a variable
                    g3e_amno = item.G3E_AMNO;
                    break; // Exit the loop once the match is found
                }
            }

            if (g3e_amno != null) {
                // Replace with the actual AnalyticalUrl and g3e_amno
                var url = AnalyticalUrl + '/search/execute/' + g3e_amno;
                var requestData = {
                    "Parameters": [{
                        "ParameterId": 1,
                        "PickListKey": 2
                    }]
                };

                var xhttp = new XMLHttpRequest();
                xhttp.open("POST", url, true);
                xhttp.setRequestHeader("Content-type", "application/json");

                xhttp.onreadystatechange = function () {
                    if (this.readyState == 4) { // When the request is complete
                        if (this.status == 200) { // If the request was successful
                            var data = JSON.parse(this.responseText);
                            console.log("responseText:" + this.responseText);
                            console.log("data :" + data);
                            populateTable(data); // Populate table with received data
                            $('#loading').remove();
                        } else {
                            var errorMessage = 'Error: ' + this.status;
                            displayErrorMessage(errorMessage); // Display error message
                        }
                    }
                };

                xhttp.send(JSON.stringify(requestData)); // Send the request with JSON data
            } else {
                console.error('G3E_AMNO not found.');
            }
        } else {
            console.error('AnalyticalUrl is null.');
        }
    } catch (error) {
        console.error('Error:', error);
    }
}

        function populateTable(data) {
    var table = document.getElementById('result-table');
    var thead = table.querySelector('thead');
    var tbody = table.querySelector('tbody');

    // Clear existing table rows and column headers
    tbody.innerHTML = '';
    thead.innerHTML = '';

    if (Array.isArray(data.ResultItems) && data.ResultItems.length > 0) {
        // Create column headers
        var headerRow = document.createElement('tr');
		
		// Add an empty cell for the checkbox column in the header row
        var checkboxHeaderCell = document.createElement('th');
        headerRow.appendChild(checkboxHeaderCell);
		
        Object.keys(data.ResultItems[0]).forEach(key => {
            var headerCell = document.createElement('th');
            headerCell.textContent = key;
            headerRow.appendChild(headerCell);
        });
        thead.appendChild(headerRow);

        // Iterate over each address item
        data.ResultItems.forEach(address => {
            var row = document.createElement('tr');

            // Add a checkbox column
            var checkboxCell = document.createElement('td');
            var checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkboxCell.appendChild(checkbox);
            row.appendChild(checkboxCell);

            // Iterate over each property of the address item
            Object.values(address).forEach(value => {
                var cell = document.createElement('td');
                cell.textContent = value;
                row.appendChild(cell);
            });

            tbody.appendChild(row);
        });

		function enableShiftClickSelection() {
            const checkboxes = $('#result-table tbody input[type="checkbox"]');

            checkboxes.on('click', function(e) {
                if (!lastChecked) {
                    lastChecked = this;
                    return;
                }

                if (e.shiftKey) {
                    const start = checkboxes.index(this);
                    const end = checkboxes.index(lastChecked);

                    checkboxes.slice(Math.min(start, end), Math.max(start, end) + 1)
                        .prop('checked', lastChecked.checked);
                }

                lastChecked = this;
            });
        }
		async function fetchLeno() {
			try {
			
				var mapsource = parent.$NWP.workspace.getSection("mapsource");
					// Initialize variables
					var vectorServiceURL=null;
					// Loop through mapsource items to find the NetworksVector type
					for (var i = 0, iLen = mapsource.items.length; i < iLen; i++) {
						if (mapsource.items[i].type === 'NetworksVector') {
							vectorServiceURL = mapsource.items[i].url;
							break;
						}
					}
				// Step 1: Fetch the JSON data
				const response = await fetch(vectorServiceURL+'/displaycontrol/1/entries');
				if (!response.ok) {
					throw new Error(`HTTP error! status: ${response.status}`);
				}
				const arrayLegendEntries = await response.json();

				// Step 2: Find the entry with the specified name
				const targetEntry = arrayLegendEntries.find(entry => entry.name === 'Fiber Branch Enclosure Geo Symbol');

				// Step 3: Extract the `leno` value from that entry
				if (targetEntry) {
					const g3e_leno = targetEntry.leno;

					// Step 4: Store the extracted value in a variable
					console.log('Extracted leno:', g3e_leno);
					return g3e_leno;
				} else {
					throw new Error('Entry with the specified name not found');
				}
			} catch (error) {
				console.error('Error fetching or processing data:', error);
			}
		}
		
		async function DisplayFBE(DataURL, transformedJson) {
				try {
					 var valuesToBePassed = [];
					// Post the transformedJson to the DataURL
					const response = await fetch(DataURL, {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json'
						},
						body: JSON.stringify(transformedJson)
					});

					if (!response.ok) {
						throw new Error('Network response was not ok ' + response.statusText);
					}

					const responseData = await response.json();

					// Extract and log the attributes fields from the response data
					if (responseData.type === 'FeatureCollection' && Array.isArray(responseData.features)) {
						responseData.features.forEach(feature => {
							if (feature.properties && feature.properties.attributes) {
                                const { G3E_FID, G3E_FNO, G3E_CNO, LABEL, MODEL } = feature.properties.attributes;
								console.log(`G3E_FID: ${G3E_FID}, G3E_FNO: ${G3E_FNO}, G3E_CNO: ${G3E_CNO}, LABEL: ${LABEL}, MODEL: ${MODEL}`);
								valuesToBePassed.push({ G3E_FID, G3E_FNO, G3E_CNO, LABEL, MODEL });
							}
						});
					}
					
					
					// Store the collected values in local storage
					localStorage.setItem('formValues', JSON.stringify(valuesToBePassed));

					if (valuesToBePassed.length === 0) {
							parent.$NWP.msg.showInfo("No Fiber Branch Enclosure features found");						 
						}
					else {
					
					if (FBESelectedWindow)
					{
						FBESelectedWindow.destroy();
					}
					// Use the parent.$NWP.createWindow function to open the second form
					FBESelectedWindow = parent.$NWP.createWindow({
						title: "Fiber Branch Enclosure Selection",
						height: 400,
						width: 600,
						url: '/AddressCommand/form_FiberBranchEnclosure.html'
					});
					window.childFBEwindow = FBESelectedWindow;
					FBESelectedWindow.show();
						}
				} catch (error) {
					console.error('Error posting data:', error);
					throw error;
				}
			}

			if (table.rows().count() === 0) {

					for (var i = 0, iLen = mapsource.items.length; i < iLen; i++) {
						if (mapsource.items[i].type === 'NetworksVector') {
							vectorServiceURL = mapsource.items[i].url;
							break;
						}
					}
				// Draw geometry and handle the result if data is found
				parent.$NWP.map.drawGeometry(parent.$NWP.map.geometryType.POINT).then(function(result) {
				if (result && result.type === 'Point' && Array.isArray(result.coordinates)) {
					const [x, y] = result.coordinates;
					const radius = 10; // 10 meter radius

					const minX = x - radius;
					const maxX = x + radius;
					const minY = y - radius;
					const maxY = y + radius;

					boundingBox = [
						minX, minY, maxX, maxY
					];					
					
					fetchLeno().then(g3e_leno => {
						vLeno = g3e_leno;
						console.log('Stored g3e_leno:', g3e_leno);
					var DataURL = vectorServiceURL+"/data?g=1&attrs=1";
					<!-- parent.$NWP.msg.showInfo("Leno:"+vLeno); -->
					<!-- parent.$NWP.msg.showInfo("DataURL:"+DataURL); -->
					<!-- parent.$NWP.msg.showInfo("boundingBox:"+boundingBox); -->
					<!-- parent.$NWP.msg.showInfo("resolution:"+vresolution); -->
					console.log('Bounding Box:', boundingBox);
					
					transformedJson = {
						"lsno": 1,
						"bbox": boundingBox,
						"resolution": vresolution,
						"entries": [{"l": vLeno, "s": 1}],
						"filters": null
					};
					console.log(JSON.stringify(transformedJson));
					DisplayFBE(DataURL, transformedJson);

					});

					
				} else {
					console.log('Invalid result:', result);
				}
			});

			}
		
			parent.$NWP.msg.showInfo("Click on Map to Select FBE");
});
