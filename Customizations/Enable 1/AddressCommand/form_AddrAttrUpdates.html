            return data;
        } catch (error) {
            console.error('Failed to fetch data:', error);
            document.getElementById("result").textContent = 'Failed to fetch data. Please check the console for details.';
            return null;
        }
    }

        }

    }

	function sendPostRequest(url,payload) {	
            console.log("In sendPostRequest");
			
      // Convert payload to JSON string
      var payloadString = JSON.stringify(payload);

      // Create new XMLHttpRequest object
      var xhr = new XMLHttpRequest();

      // Set the HTTP method, URL, and asynchronous flag
      xhr.open('POST', url, true);

      // Set the request header
      xhr.setRequestHeader('Content-Type', 'application/json');

      // Define the function to handle the response
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
            // Request was successful
            console.log('Request successful');
            console.log(xhr.responseText);
        } else {
            // Request failed
            console.error('Request failed');
            console.error(xhr.statusText);
        }
      };

      // Define the function to handle network errors
      xhr.onerror = function () {
        console.error('Network error');
      };

      // Send the request with the payload
      xhr.send(payloadString);
	  IsDelete = "Yes";
    }
	
async function fetchData(fidCSV) {
    console.log("FID CSV >", fidCSV, "<");
	var AnalyticalUrl = await getServiceUrl('AnalyticalService');
        console.log('Service URL:', AnalyticalUrl);
    if (AnalyticalUrl != null) {
            const response = await fetch(AnalyticalUrl + '/Search/QuickSearches');
            const data = await response.json();

            // Loop through each object in the response array
            let g3e_amno = null;
            for (let item of data) {
                // Check if the UserName matches the targetUserName
                if (item.UserName === "Address By FID") {
                    // Store the G3E_AMNO in a variable
                    g3e_amno = item.G3E_AMNO;
                    break; // Exit the loop once the match is found
                }
            }

            if (g3e_amno != null) {
                // Replace with the actual AnalyticalUrl and g3e_amno
                var url = AnalyticalUrl + '/search/execute/' + g3e_amno;
				const fids = fidCSV.split(','); // Split the comma-separated string into individual FIDs
				let combinedData = []; // Array to hold all combined data
				let requestsCompleted = 0; // Counter to track completed requests

				fids.forEach((fid) => {
					const requestData = {
						"Parameters": [{
							"ParameterId": 1,
							"TextValue": fid // Use the individual FID here
						}]
					};

				console.log("Request >", requestData, "<");
				console.log(requestData);

				const xhttp = new XMLHttpRequest();
				xhttp.open("POST", url, true);
				xhttp.setRequestHeader("Content-type", "application/json");

				xhttp.onreadystatechange = function () {
            if (this.readyState === 4) {
                if (this.status === 200) {
                    const data = JSON.parse(this.responseText);
                    console.log("responseText:", this.responseText);
                    console.log("data:", data);
                    combinedData = combinedData.concat(data); // Concatenate the response data

                    requestsCompleted++;
                    if (requestsCompleted === fids.length) {
                        $('#loading').remove();
                        populateTable(combinedData); // Populate table with combined data once all requests are completed
						 localStorage.removeItem('CloseEditCommonAttribute');
                    }
                } else {
                    const errorMessage = 'Error: ' + this.status;
                    displayErrorMessage(errorMessage);
                }
            }
			
        };

        xhttp.send(JSON.stringify(requestData));
		
    })
	};
}

		async function fetchNetworkSolutionData() {
				try {
					// Get the mapsource section
					var mapsource = parent.$NWP.workspace.getSection("mapsource");

					// Initialize variables
					var vectorServiceURL;

					// Loop through mapsource items to find the NetworksVector type
					for (var i = 0, iLen = mapsource.items.length; i < iLen; i++) {
						if (mapsource.items[i].type === 'NetworksVector') {
							vectorServiceURL = mapsource.items[i].url;
							urlSolution = vectorServiceURL.substring(0, vectorServiceURL.lastIndexOf('/')) + '/NetWorksSolutionService';
							break;
						}
					}

					// Check if urlSolution was found
					if (!urlSolution) {
						throw new Error("NetworksVector type not found in mapsource items.");
					}
					
					//Retrieve the DB Alias for the Solution Service
					var dbAlias=await parent.$NWP.fetchJson({ url: urlSolution });

					// Fetch data from the selected option endpoint
					const response = await fetch(`${urlSolution}/${dbAlias}/`, {
						method: 'GET',
						headers: {
							'Content-Type': 'application/json'
						}
					});

					// Check if the response is ok
					if (!response.ok) {
						throw new Error(`HTTP error! status: ${response.status}`);
					}

					// Parse the response data as JSON
					const urlSolutiondata = await response.json();

					// Check if urlSolutiondata is null
					if (urlSolutiondata === null) {
						throw new Error("Received null data from the network solution service.");
					}

					// Return the parsed data
					return urlSolutiondata;

				} catch (error) {
					// Handle errors
					console.error('Error fetching network solution data:', error);
					throw error;  // Re-throw the error after logging it
				}
			}
		function findServiceUrl(urlSolutiondata, serviceType) {
			for (const service of urlSolutiondata) {
				if (service.Type === serviceType) {
					return service.Url;
				}
			}
			throw new Error(`${serviceType} not found in network solution data.`);
		}

		async function getServiceUrl(serviceType) {
			try {
				// Fetch network solution data
				const urlSolutiondata = await fetchNetworkSolutionData();

				// Find and return the service URL for the specified service type
				const serviceUrl = findServiceUrl(urlSolutiondata, serviceType);
				return serviceUrl;
			} catch (error) {
				console.error('Error:', error);
				throw error;
			}
		}

			}

			let allResultItems = [];

			combinedData.forEach(data => {
				if (Array.isArray(data.ResultItems) && data.ResultItems.length > 0) {
					allResultItems = allResultItems.concat(data.ResultItems);
				}
			});

			if (allResultItems.length > 0) {
				// Create column headers from the keys of the first ResultItem
				var headerRow = document.createElement('tr');

				// Add an empty cell for the checkbox column in the header row
				var checkboxHeaderCell = document.createElement('th');
				headerRow.appendChild(checkboxHeaderCell);

				Object.keys(allResultItems[0]).forEach(key => {
					var headerCell = document.createElement('th');
					headerCell.textContent = key;
					headerRow.appendChild(headerCell);
				});

				thead.appendChild(headerRow);

				// Iterate over each item in allResultItems
				allResultItems.forEach(item => {
					var row = document.createElement('tr');

					// Add a checkbox column
					var checkboxCell = document.createElement('td');
					var checkbox = document.createElement('input');
					checkbox.type = 'checkbox';
					checkboxCell.appendChild(checkbox);
					row.appendChild(checkboxCell);

					// Iterate over each property of the item
					Object.values(item).forEach(value => {
						var cell = document.createElement('td');
						cell.textContent = value;
						row.appendChild(cell);
					});

					tbody.appendChild(row);
				});

    function enableShiftClickSelection() {
        const checkboxes = $('#result-table tbody input[type="checkbox"]');

        checkboxes.on('click', function(e) {
            if (!lastChecked) {
                lastChecked = this;
                return;
            }

            if (e.shiftKey) {
                const start = checkboxes.index(this);
                const end = checkboxes.index(lastChecked);

                checkboxes.slice(Math.min(start, end), Math.max(start, end) + 1)
                    .prop('checked', lastChecked.checked);
            }

            lastChecked = this;
        });
    }
